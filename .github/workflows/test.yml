name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0, 0,12 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Formatting
      run: |
        python -m pip install --upgrade pip
        pip install ruff flake8
    - name: Check Formatting
      run: |
        ruff check .
        flake8 .

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: typos-action
        uses: crate-ci/typos@v1.29.10

  documents:
    name: Build Sphinx Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install --no-cache-dir .\[all\]
    - name: Build Sphinx Documentation (HTML)
      working-directory: ./docs/source
      run: |
        mkdir -p _build/doctrees
        sphinx-build -T -W --keep-going -b html -d _build/doctrees -D language=en . _build/html
    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update -qq -y
        sudo apt-get install -qq -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latexmk
    - name: Build Sphinx Documentation (PDF)
      working-directory: ./docs
      run: |
        make latexpdf

  tests-3x:
    name: Run Unit Tests (Python 3.x)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: 3.10.10
            os: ubuntu-latest
            numpy-version: "1.23.5"
            scipy-version: "1.8.0"
            remove-setuptools: false
          - python-version: 3.10.10
            os: ubuntu-latest
            numpy-version: "1.21.5"
            scipy-version: "latest"
            remove-setuptools: false
          - python-version: 3.10.10
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "1.8.0"
            remove-setuptools: false
          - python-version: 3.10.10
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "latest"
            remove-setuptools: false

          - python-version: 3.12.3
            os: ubuntu-latest
            numpy-version: "1.26.4"
            scipy-version: "1.11.4"
            remove-setuptools: false
          - python-version: 3.12.3
            os: ubuntu-latest
            numpy-version: "1.26.4"
            scipy-version: "latest"
            remove-setuptools: false
          - python-version: 3.12.3
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "1.11.4"
            remove-setuptools: false
          - python-version: 3.12.3
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "latest"
            remove-setuptools: false
          - python-version: 3.12.3
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "latest"
            remove-setuptools: true  # <- this one uses the latest setuptools

          - python-version: 3.13
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "latest"
            remove-setuptools: false
          - python-version: 3.13
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "latest"
            remove-setuptools: true  # <- this one uses the latest setuptools

          - python-version: "3.14"
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "latest"
            remove-setuptools: false
            skip-all-extras: true  # pybullet does not build on 3.14 yet
          - python-version: "3.14"
            os: ubuntu-latest
            numpy-version: "latest"
            scipy-version: "latest"
            remove-setuptools: true
            skip-all-extras: true
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Wait for apt-get lock
      run: |
        while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for apt lock release..."
          sleep 1
        done
    - name: Install APT On Linux
      run: |
        sudo apt-get update -qq -y
        sudo apt-get install -qq -y libspatialindex-dev freeglut3-dev libsuitesparse-dev libblas-dev liblapack-dev
        sudo apt-get install -qq -y xvfb # for headless testing
    - name: Install Blender
      run: |
        sudo apt-get install -qq -y wget
        BLENDER_VERSION="4.2.0"
        BLENDER_URL="https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
        wget -q ${BLENDER_URL} -O /tmp/blender.tar.xz
        sudo tar -xf /tmp/blender.tar.xz -C /opt
        sudo ln -s /opt/blender-${BLENDER_VERSION}-linux-x64/blender /usr/local/bin/blender
        blender --version
    - name: Install Pytest
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython
        pip install pytest pytest-xdist pytest-timeout ruff
    - name: Install scikit-robot
      run: |
        pip cache purge
        if [ "${{ matrix.skip-all-extras }}" = "true" ]; then
          pip install --no-cache-dir .
        else
          pip install --no-cache-dir .\[all\]
        fi

    - name: Install NumPy and SciPy
      run: |
        if [ "${{ matrix.numpy-version }}" = "latest" ]; then
          pip install numpy -U
        else
          pip install numpy==${{ matrix.numpy-version }}
        fi
        if [ "${{ matrix.scipy-version }}" = "latest" ]; then
          pip install scipy -U
        else
          pip install scipy==${{ matrix.scipy-version }}
        fi
    - name: Work around a wrong OpenBLAS dgemm on some runners
      # Part of the runner pool -- an Intel Xeon 6973P-C, about one job in
      # twelve -- returns wrong numbers from numpy's bundled OpenBLAS, which
      # detects it as Cooperlake.  The (4, 4) by (4, n) product every
      # trimesh.transform_points call makes comes back as [10*x + 10, 0, 0]
      # for most rows once n passes roughly 128: the homogeneous row folded
      # into the first column and the other two zeroed.  Every mesh a URDF
      # scales goes through that call, so the model loads misshapen and lands
      # as an unexplained geometry failure somewhere downstream -- it was
      # showing up as test_sdf_from_robot_with_scale_parameter measuring a
      # grid 7.4 times too wide, and as the Mitsuba viewer sizing a Panda
      # scene wrong in the same job.
      #
      # Measured on the affected runner: HASWELL, SKYLAKEX and NEHALEM all
      # give exact results, SAPPHIRERAPIDS does not, and OPENBLAS_NUM_THREADS=1
      # makes no difference, so it is the kernel and not a race.  HASWELL is
      # the one to force because this has to be harmless on the runners it is
      # not aimed at, and SKYLAKEX would put AVX-512 kernels on the EPYC 7763s
      # that make up much of the pool and do not have it.
      #
      # Only set on a runner that actually fails the multiply, so the rest
      # keep their own kernels. OpenBLAS reads the variable when it loads, so
      # this cannot be done from inside the test session; it has to be here.
      run: |
        if ! python - <<'PY'
        import sys

        import numpy as np

        n = 2503
        V = np.random.default_rng(0).random((n, 3))
        M = np.eye(4)
        M[:3, :3] = np.diag([10.0, 10.0, 10.0])
        stack = np.column_stack((V, np.ones(n)))
        got = np.dot(M, stack.T).T[:, :3]
        sys.exit(int(np.abs(got - V * 10.0).max() > 1e-9))
        PY
        then
          echo "::warning::$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-) returns wrong results from numpy's BLAS; forcing OPENBLAS_CORETYPE=HASWELL"
          echo "OPENBLAS_CORETYPE=HASWELL" >> "$GITHUB_ENV"
        fi
    - name: Install matplotlib for examples
      run: |
        # Required for differential_wrist_joint_limit_demo.py
        pip install matplotlib
    - name: Remove setuptools
      run: |
        # Simulate 3.12> + venv where setuptools is not pre-installed by default.
        if [ "${{ matrix.remove-setuptools }}" = "true" ]; then
          pip uninstall -y setuptools
        else
          echo "setuptools is not removed"
        fi
    - name: Run Pytest
      run: |
        # --timeout: per-test timeout in seconds (300s = 5 minutes)
        # --durations=0: show duration of all tests to identify slow ones
        PYTEST="xvfb-run pytest -v -n auto --dist loadscope --timeout=300 --durations=0"
        if $PYTEST tests; then
          exit 0
        fi
        # Retry only the tests that just failed (--last-failed) rather than the
        # whole suite. A genuinely flaky test clears in seconds instead of
        # costing another full ~3 min run, and a real failure still fails the
        # job. The rerun keeps the same '-n auto --dist loadscope' setup on
        # purpose: dropping to a serial rerun would turn every parallel-execution
        # bug into a green tick.
        failed=""
        for attempt in 2 3; do
          failed=$(python -c "import json; print(' '.join(json.load(open('.pytest_cache/v/cache/lastfailed'))))" 2>/dev/null || true)
          echo "::warning::attempt $((attempt - 1)) failed; rerunning only: ${failed:-<no lastfailed record, rerunning everything>}"
          sleep 10
          if $PYTEST --last-failed tests; then
            echo "::warning::FLAKY: failed on attempt $((attempt - 1)), passed on attempt $attempt: $failed"
            exit 0
          fi
        done
        echo "::error::the same tests failed on all 3 attempts, so this is not flakiness: $failed"
        exit 1

  ros2-tests:
    name: Run ROS 2 Unit Tests (${{ matrix.ros-distribution }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros-distribution: jazzy
            os: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Add the ROS 2 apt repository
      # Done by hand instead of via ros-tooling/setup-ros@v0.7, because that
      # action resolves which ros-apt-source release to fetch with an
      # *unauthenticated* `curl https://api.github.com/.../releases/latest`.
      # Whenever the runner's IP is over the anonymous API rate limit the
      # response carries no "tag_name", the version expands to the empty
      # string, and the download URL degenerates into
      #   .../releases/download//ros2-apt-source_.noble_all.deb
      # which 404s and kills the job before a single test runs. That is
      # https://github.com/ros-tooling/setup-ros/issues/892, still open, and it
      # was failing roughly one in six runs here. The install below is the same
      # one, except the version is resolved through `gh` -- authenticated with
      # GITHUB_TOKEN, so the anonymous limit does not apply.
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        version=$(gh release view --repo ros-infrastructure/ros-apt-source \
          --json tagName --jq .tagName)
        # Fail on an unresolvable version here, saying so, rather than letting
        # it travel downstream and resurface as an unexplained 404.
        if [ -z "$version" ]; then
          echo "::error::could not resolve the latest ros-apt-source release"
          exit 1
        fi
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        deb=$(mktemp --suffix=.deb)
        curl --fail --location --retry 3 --retry-delay 2 -o "$deb" \
          "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${version}/ros2-apt-source_${version}.${codename}_all.deb"
        sudo dpkg -i "$deb"
        rm -f "$deb"
    - name: Install ROS 2
      # ros-base is all these tests need -- it carries rclpy -- rather than the
      # ros-<distro>-desktop setup-ros pulled in, which spent about three
      # minutes on RViz and friends nothing here touches. The message / action
      # packages that skrobot.interfaces.ros2.base imports are not part of
      # ros-base, hence naming them too. python3-pytest is named because
      # setup-ros used to install it as a side effect of its own dependency
      # set; keeping it makes the `pip install pytest` below a no-op, so pytest
      # stays the distro's 7.4.4 on /usr/bin/pytest rather than a newer one
      # landing in ~/.local underneath the plugin handling described further
      # down. numpy needs no such entry -- python3-numpy arrives transitively
      # via rosidl-generator-py.
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          ros-${{ matrix.ros-distribution }}-ros-base \
          ros-${{ matrix.ros-distribution }}-control-msgs \
          ros-${{ matrix.ros-distribution }}-trajectory-msgs \
          ros-${{ matrix.ros-distribution }}-action-msgs \
          ros-${{ matrix.ros-distribution }}-sensor-msgs \
          python3-pytest
    - name: Install Python dependencies
      shell: bash
      run: |
        source /opt/ros/${{ matrix.ros-distribution }}/setup.bash
        python -m pip install --upgrade pip setuptools wheel
        pip install pytest pytest-timeout
        # Install the project itself; '[all]' would pull pybullet etc., but
        # the ROS 2 unit tests only need the core skrobot model + URDF code.
        pip install -e .
    - name: Run ROS 2 unit tests
      shell: bash
      # PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 stops pytest from auto-loading every
      # plugin advertised on the ROS 2 distro's PYTHONPATH (launch_testing,
      # launch_testing_ros, ament_lint, ...). They each ship pytest hooks that
      # are incompatible with newer pluggy or assume their own collector
      # entrypoint, which crashes plain unit-test collection. We explicitly
      # opt back in to the plugins this job needs (pytest-timeout) via -p.
      # --timeout=60 keeps any regression of the wait_until_update_all_joints
      # hang surfacing as a per-test timeout instead of a stuck CI run.
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      run: |
        source /opt/ros/${{ matrix.ros-distribution }}/setup.bash
        pytest -v -p pytest_timeout --timeout=60 \
          tests/skrobot_tests/interfaces_tests/ros2/

  tests-windows:
    name: Run Unit Tests (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Pytest
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install Cython
        python -m pip install pytest pytest-xdist pytest-timeout ruff
    - name: Install scikit-robot
      run: |
        python -m pip install --no-cache-dir .[all]
    - name: Run Pytest
      run: |
        python -m pytest -v -n auto --dist loadscope --timeout=300 --durations=0 tests --ignore=tests/skrobot_tests/viewers_tests --ignore=tests/skrobot_tests/test_examples.py


